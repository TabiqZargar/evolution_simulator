[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evolution-simulator"
version = "0.1.0"
description = "A pure-Python evolution simulator: organisms forage, compete, reproduce and adapt over generations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pygame>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.setuptools]
packages = [
    "evolution_sim",
    "evolution_sim.simulation",
    "evolution_sim.analytics",
    "evolution_sim.visualization",
    "evolution_sim.persistence",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I"]
ignore = [
    "E501",
    "B008",
]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = false
warn_unused_configs = true
no_implicit_reexport = true
exclude = ["tests", "main.py"]

[[tool.mypy.overrides]]
module = ["pygame", "pygame.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"